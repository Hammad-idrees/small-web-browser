name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    # Pinned, so a change of what "latest" means cannot change CI unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Mongo starts alongside the job; wait here until it accepts connections.
      - name: Wait for MongoDB
        run: |
          for attempt in $(seq 1 30); do
            if nc -z localhost 27017; then
              echo "MongoDB is up"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not start" >&2
          exit 1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API tests
        run: pnpm test:e2e

      - name: Install the browser for the browser tests
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
